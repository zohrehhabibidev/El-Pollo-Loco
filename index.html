<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./css/style.css" />
    <link rel="stylesheet" href="./css/game-ui.css" />
    <link rel="icon" href="./assets/img/ui/3_icons/icon_salsa_bottle.png" />
    <script src="./js/classes/drawable-object.class.js" defer></script>
    <script src="./js/classes/movable-object.class.js" defer></script>
    <script src="./js/classes/background-object.class.js" defer></script>
    <script src="./js/classes/cloud.class.js" defer></script>
    <script src="./js/classes/keyboard.class.js" defer></script>
    <script src="./js/classes/character.class.js" defer></script>
    <script src="./js/classes/chicken.class.js" defer></script>
    <script src="./js/classes/throwable-object.class.js" defer></script>
    <script src="./js/classes/endboss.class.js" defer></script>
    <script src="./js/classes/bottle.class.js" defer></script>
    <script src="./js/classes/status-bar.class.js" defer></script>
    <script src="./js/classes/bottle-status-bar.class.js" defer></script>
    <script src="./js/classes/coin.class.js" defer></script>
    <script src="./js/classes/coin-status-bar.class.js" defer></script>
    <script src="./js/classes/endboss-status-bar.class.js" defer></script>
    <script src="./js/classes/world.class.js" defer></script>
    <script src="./js/utils/audio.js" defer></script>
    <script src="./js/utils/fullscreen.js" defer></script>
    <script src="./js/script.js" defer></script>
    <script src="./js/screens/start-screen.js" defer></script>

    <title>El Pollo Loco</title>
  </head>

  <body>
    <main id="game-layout">
      <h1 id="game-title">El Pollo Loco</h1>

      <div id="game-stage">
        <div id="game-toolbar">
          <button id="mute-button" type="button" aria-label="Mute sounds">
            🔊
          </button>

          <button
            id="fullscreen-button"
            type="button"
            aria-label="Enter fullscreen"
            title="Enter fullscreen"
          >
            ⛶
          </button>
        </div>
        <canvas
          id="game-canvas"
          width="720"
          height="480"
          style="border: 1px solid #000000"
        >
          <!-- render :
            character
            background
            enemy
            bottles
            status bars
            ...
          -->
        </canvas>
        <div id="game-overlays">
          <div id="start-screen">
            <img
              id="start-screen-image"
              src="./assets/img/screens/start/startscreen_1.png"
              alt="El Pollo Loco start screen"
            />

            <div id="start-buttons">
              <button id="start-button" class="game-btn start" type="button">
                ► START
              </button>

              <button id="help-button" class="game-btn help" type="button">
                ⓘ GUIDE
              </button>

              <button
                class="game-btn impressum"
                type="button"
                onclick="window.location.href='./impressum.html'"
              >
                § IMPRESSUM
              </button>
            </div>
          </div>

          <div id="guide-popup" class="hidden">
            <div id="guide-card">
              <button id="close-guide-button" aria-label="Close guide">
                ✖
              </button>

              <h2>GAME GUIDE</h2>

              <p>Help Pepe survive the desert and defeat the crazy chickens.</p>

              <div class="guide-row">
                <span>⬅️ ➡️</span>
                <p>Move left and right</p>
              </div>

              <div class="guide-row">
                <span>⌴</span>
                <p>Jump</p>
              </div>

              <div class="guide-row">
                <span>D</span>
                <p>Throw bottle</p>
              </div>
            </div>
          </div>
          <div id="lose-screen" class="hidden">
            <img
              id="lose-screen-image"
              src="./assets/img/screens/lose/game-over-pepe-pic.png"
              alt="Game over screen"
            />

            <div id="lose-buttons">
              <button id="try-again-button" class="game-btn start">
                TRY AGAIN
              </button>
              <button id="menu-button" class="game-btn help">MENU</button>
            </div>
          </div>
          <div id="win-screen" class="hidden">
            <img
              id="win-screen-image"
              src="./assets/img/screens/win/you-win-a.png"
              alt="You won screen"
            />

            <div id="win-buttons">
              <button id="win-try-again-button" class="game-btn start">
                TRY AGAIN
              </button>
              <button id="win-menu-button" class="game-btn help">MENU</button>
            </div>
          </div>
        </div>
        <div id="mobile-controls" aria-label="Mobile game controls">
          <div class="mobile-control-group">
            <button
              id="mobile-left-button"
              class="mobile-control-button"
              type="button"
              aria-label="Move left"
            >
              ◀
            </button>
            <button
              id="mobile-right-button"
              class="mobile-control-button"
              type="button"
              aria-label="Move right"
            >
              ▶
            </button>
          </div>

          <div class="mobile-control-group">
            <button
              id="mobile-jump-button"
              class="mobile-control-button"
              type="button"
              aria-label="Jump"
            >
              ⤴
            </button>
            <button
              id="mobile-throw-button"
              class="mobile-control-button"
              type="button"
              aria-label="Throw bottle"
            >
              <img
                class="mobile-control-icon"
                src="./assets/img/ui/3_icons/icon_salsa_bottle.png"
                alt=""
                aria-hidden="true"
              />
            </button>
          </div>
        </div>
      </div>
    </main>

    <div id="portrait-warning">
      <div class="portrait-warning-card">
        <h2>Rotate your device</h2>
        <p>Please turn your phone to landscape mode to play.</p>
      </div>
    </div>

    <footer id="page-footer">
      <a id="impressum-link" href="./impressum.html">Impressum</a>
    </footer>
  </body>
</html>
